# Builds the firmware and publishes the website (site/) with the browser installer to GitHub Pages.
# Runs on every published release, or by hand from the Actions tab. The firmware always comes from the latest
# release tag, so a run by hand (for website changes) still offers the released version, not whatever is on main.
name: Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # attaches the firmware files to the release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version shown on the site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware from the latest release
        run: |
          set -e
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="$(git describe --tags --abbrev=0)"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          git worktree add ../release "$tag"
          cd ../release && pio run -e epaper154

      - name: Collect firmware and write the installer manifests
        run: |
          set -e
          out=site/firmware
          mkdir -p "$out"
          b=../release/.pio/build/epaper154
          cp "$b/bootloader.bin" "$b/partitions.bin" "$b/firmware.bin" "$out/"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$out/"
          version="$RELEASE_TAG"
          python3 - "$out" "$version" <<'PY'
          import json, sys
          out, version = sys.argv[1], sys.argv[2]
          parts = [("bootloader.bin", 0x0), ("partitions.bin", 0x8000), ("boot_app0.bin", 0xE000),
                   ("firmware.bin", 0x10000)]  # files live on the SD card: no filesystem image
          def manifest(parts, erase):
              return {"name": "unidex", "version": version, "new_install_prompt_erase": erase,
                      "new_install_improv_wait_time": 0,
                      "builds": [{"chipFamily": "ESP32-S3",
                                  "parts": [{"path": p, "offset": o} for p, o in parts]}]}
          # Install: everything, offered with a full erase. Update: the app only, so data stays.
          json.dump(manifest(parts, True), open(f"{out}/install.json", "w"), indent=2)
          json.dump(manifest([p for p in parts if p[0] == "firmware.bin"], False), open(f"{out}/update.json", "w"), indent=2)
          PY
          ls -la "$out"

      # The Xteink X4 (RoomiePet) firmware, signed for radio updates (tools/ota/sign.py, through the build's
      # tools/ota/sign_build.py) when the release key is set as the secret OTA_SIGNING_KEY: X4s on an older release
      # then take it from each other. Flashed over USB like any other (the signature rides after the image).
      - name: Build the X4 firmware from the latest release, signed
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -e
          pip install -q cryptography
          cd ../release
          git submodule update --init
          pio run -e x4
          mkdir -p "$GITHUB_WORKSPACE/x4"
          cp .pio/build/x4/firmware.bin "$GITHUB_WORKSPACE/x4/roomiepet-x4-$RELEASE_TAG-firmware.bin"
          if [ -n "$OTA_SIGNING_KEY" ]; then
            python3 tools/ota/sign.py "$GITHUB_WORKSPACE/x4/roomiepet-x4-$RELEASE_TAG-firmware.bin" --verify
          else
            echo "::warning::OTA_SIGNING_KEY isn't set: the X4 firmware is unsigned, so X4s won't pass it on by radio"
          fi

      - name: Attach the firmware files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          d=$(mktemp -d)
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin; do
            cp "site/firmware/$f" "$d/unidex-$RELEASE_TAG-$f"
          done
          cp x4/*.bin "$d/"
          (cd "$d" && sha256sum unidex-* roomiepet-* > "unidex-$RELEASE_TAG-SHA256SUMS.txt")
          gh release upload "$RELEASE_TAG" "$d"/* --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
