# Checks every push and pull request: the firmwares build (normal and test builds, for the Waveshare board and the
# Xteink X4) and every computer test passes (tools/run_tests.sh). Nothing is published from here; the website comes from site.yml.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version tools/version.py writes
          submodules: true  # freeink-sdk, for the X4 build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Computer tests
        run: |
          sudo apt-get install -y -qq libmbedtls-dev > /dev/null  # tools/otatest and securetest use it
          tools/run_tests.sh

      # The home server, talked to as an X4 would (server/test_server.py).
      - name: Home server
        run: |
          pip install -q cryptography
          python3 -m unittest server/test_server.py

      # Files made from others: the Pet's parts for the websites, and the things to hold from catalog/items.txt.
      - name: Generated files are up to date
        run: |
          pip install -q pillow
          python3 tools/pet/export.py --check
          python3 tools/items/build.py --check

      # The X4 web app's household rules: house.wasm is house_logic.h compiled with clang (tools/wasm/build.sh). The
      # committed file and a fresh build both pass the same checks (byte-for-byte equality isn't asked: another
      # clang version may lay it out differently).
      - name: WebAssembly (site/x4/house.wasm)
        run: |
          sudo apt-get install -y -qq lld > /dev/null
          node tools/wasm/house_wasm_test.mjs
          tools/wasm/build.sh /tmp/house.wasm
          node tools/wasm/house_wasm_test.mjs /tmp/house.wasm

      - name: Build the firmware
        run: pio run -e epaper154

      - name: Build the test firmware
        run: pio run -e dev

      - name: Build the Xteink X4 firmware
        run: pio run -e x4

      # Radio updates are off until the release key exists (src/core/ota_key.h): build them on with a throwaway key,
      # so that code is checked too, and sign the result to check the signing tool on a real image.
      - name: Build the X4 firmware with radio updates on (a throwaway key)
        run: |
          pip install -q cryptography
          python3 tools/ota/keygen.py --out /tmp/ota-test-key.pem
          pio run -e x4
          strings .pio/build/x4/firmware.bin | grep -q "RPOTA:" || (echo "no RPOTA marker in the image"; exit 1)
          git checkout src/core/ota_key.h

      - name: Build the Xteink X4 test firmware
        run: pio run -e x4-dev
