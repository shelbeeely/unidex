[platformio]
default_envs = epaper154  ; `pio run` builds the Waveshare firmware; the X4 one is `pio run -e x4`

; Waveshare ESP32-S3-ePaper-1.54 (V2) — ESP32-S3-PICO-1-N8R8
; 8 MB QIO flash + 8 MB octal PSRAM, native USB (no UART bridge).
[env:epaper154]
platform = espressif32@6.11.0      ; pinned, like the libraries: a release build never changes by itself
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 115200               ; no baud switch: it drops the USB link on this board
extra_scripts =
    pre:tools/version.py              ; the firmware version from git (Settings, the website's sync)
    post:tools/upload_nostub.py
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6    ; text, lines and bitmaps into the screen buffer (src/core/display.*)
    adafruit/Adafruit BusIO@1.17.4          ; needed by GFX
    bblanchon/ArduinoJson@7.4.3
    ricmoo/QRCode@0.0.1                 ; the join codes: Notes "Open on phone", the welcome screen
board_build.embed_files = certs/x509_crt_bundle.bin   ; root CAs for HTTPS (see certs/README.md)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB
    -DDEBUG=0                     ; 1 = serial logs + wait for USB on cold boot

; Test build: adds USB screenshot and virtual-button commands (src/core/devtools.h, tools/devshot.py).
; Same partitions, so flashing it keeps settings and keys. Flash the normal env again before shipping.
[env:dev]
extends = env:epaper154
build_flags =
    ${env:epaper154.build_flags}
    -DUNIDEX_DEV=1

; Xteink X4 (4.26" 800x480 e-paper reader): ESP32-C3, 16 MB flash, no PSRAM, USB Serial/JTAG. The panel, keys,
; battery and board pins come from the FreeInk SDK (the freeink-sdk submodule: git submodule update --init), which
; needs the pioarduino platform (Arduino core 3, ESP-IDF 5). The 200x200 screens are drawn at twice the size in the
; middle of the panel; no microphone, so no Notes. See docs/X4.md.
[env:x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

board_build.flash_mode = dio        ; the X4's module is wired for DIO
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_web.py            ; the web app (site/x4) into the firmware, for its hotspot
lib_deps =
    ${env:epaper154.lib_deps}
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
board_build.embed_files = ${env:epaper154.board_build.embed_files}
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++2a
    -DUNIDEX_X4=1
    -DFREEINK_DEVICE_X4=1           ; the SDK's X4 board profile and SSD1677 driver only
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1   ; one 48 KB framebuffer: the controller keeps the previous image
    -DARDUINO_USB_MODE=1          ; the C3's USB Serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB
    -DDEBUG=0

; X4 test build (as env:dev for the Waveshare board).
[env:x4-dev]
extends = env:x4
build_flags =
    ${env:x4.build_flags}
    -DUNIDEX_DEV=1
